<head>
  <meta charset="UTF-8">
  <title>t1a06-Proper and Variables-Blaze</title>
  <style>
    b { color: blue; }
  </style>
  <script>
    function sayHello() {
      let myNum = 3;
      let myString = ' Hello ';
      let myFloat = 17.5;
      let myBool = true;
      let myOut = document.getElementById('myDiv01');
      myOut.innerHTML = myNum + myString + myFloat + ',' + myBool;
      if (myBool) {
        myOut.innerHTML += ',WOW';
      }
    }
  </script>
</head>
<body>
  <p>This is <b>bold</b> text.</p>
  <button onclick="sayHello()">Click Me</button>
  <div id="myDiv01">XYZ</div>
</body>
