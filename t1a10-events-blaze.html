<script>
function myAddNum() {
let myIn01 = parseInt(document.getElementById('myText01').value, 10);
let mySum01 = myIn01 + myIn01;
let myReply01 = myIn01 + ' + ' + myIn01 + ' = ' + mySum01;
return myReply01;}
function myMultNum() {
let myIn02 = parseInt(document.getElementById('myText02').value, 10);
let mySum02 = myIn02 * myIn02;
let myReply02 = myIn02 + ' X ' + myIn02 + ' = ' + mySum02;
return myReply02;}</script>
<h2 align="center">t1a10-Events</h2>
<a href="https://www.w3schools.com/tags/ref_eventattributes.asp">HTML Cheat Sheet</a><br><br>
Events are HTML code that activates Javascript code.<br><br>
<input type="text" id="myText01" value="3"><br>
<input type="button" value="Outputs entered number"
onclick="document.getElementById('myDiv01').innerHTML =
document.getElementById('myText01').value"><br>
<b id="myB02"
onmouseout="document.getElementById('myB02').innerHTML = '...and this is bold.'"
onmouseover="document.getElementById('myB02').innerHTML = 'This is cool...'">
Hover mouse here</b><br>
<input type="text" id="myText02" value="5"><br>
<input type="button" value="Function Example"
onclick="document.getElementById('myDiv01').innerHTML = myAddNum()"><br>
<input type="text" id="myText03" value="3"><br>
<input type="button" value="Function Example"
ondblclick="document.getElementById('myDiv01').innerHTML = myMultNum()"><br><br>
<input type="text" value="Focus on me"
onfocus="document.getElementById('myDiv01').innerHTML = 'The text box is focused.'"><br><br>
<input type="text" value="Click outside me"
onblur="document.getElementById('myDiv01').innerHTML = 'You left the text box.'"><br><br>
<input type="text" placeholder="Press a key"
onkeydown="document.getElementById('myDiv01').innerHTML = 'You pressed a key.'"><br><br>
<input type="text" placeholder="Release a key"
onkeyup="document.getElementById('myDiv01').innerHTML = 'You released a key.'"<br><br>
<select onchange="document.getElementById('myDiv01').innerHTML = 'You changed the selection.'">
<option>Choose a color</option>
<option>Red</option>
<option>Blue</option>
<option>Green</option>
</select><br><br>
<input type="text" placeholder="Type something"
oninput="document.getElementById('myDiv01').innerHTML = 'You are typing: ' + this.value"><br><br>
<div id="myDiv01"></div>
