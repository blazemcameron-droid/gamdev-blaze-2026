<script>
function myAddNum() {
let myIn01 = parseInt(document.getElementById('myText01').value, 10);
let mySum01 = myIn01 + myIn01;
let myReply01 = myIn01 + ' + ' + myIn01 + ' = ' + mySum01;
return myReply01;}
function myMultNum() {
let myIn02 = parseInt(document.getElementById('myText02').value, 10);
let mySum02 = myIn02 * myIn02;
let myReply02 = myIn02 + ' X ' + myIn02 + ' = ' + mySum02;
return myReply02;}</script>
