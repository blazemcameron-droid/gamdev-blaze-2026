<h4>Some examples of arrays:</h4>
Max Array Entry:
<input type=number id="myText01" value="3"><br>
<input type=button value="Array Button" onclick="
let myTemp = Number(document.getElementById('myText01').value);
let mySum = ''; document.getElementById('myDiv01').innerHTML = '';

<div id="myDiv01"></div>
