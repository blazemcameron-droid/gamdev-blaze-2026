<h1 align=center>t1a13-Classes</h1>
<a href="https://www.javascriptcheatsheet.org/cheatsheet/classes">A how-to on Javascript classes</a><br>
<h4>An example</h4>
<input type=text id="myText01" value="Useless"><br>
<input type=button value="Build Class" onClick="{
class myRobot {
constructor(passModel, passPurpose) {
this.myModel = passModel;
this.myPurpose = passPurpose;}
myShowcase(){
document.getElementById('myDiv01').innerHTML = 'Hello, user. I am model ' + this.myModel + '. My purpose is ' + this.myPurpose + ' .'}}
myCleaner = new myRobot('612473', 'cleaning dust and other garbage from floors')
myCleaner.myShowcase()}">
<div id="myDiv01"></div>
