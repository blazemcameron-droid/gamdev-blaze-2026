<html><head><title>Game Template</title></head>
<body id="myBody" style="background-repeat:repeat; background-size:80%;" background="myBackground01.jpg">
<h1 style="text-align:center;">t2a18-game-template-fred</h1><br><br><br><br><script>
let myGlobalX = 0;
let myClock;
function myHitOther(my1, my2) {
   let left1 = parseInt(document.getElementById(my1).style.left);
   let right1 = left1 + parseInt(document.getElementById(my1).style.width);
   let top1 = parseInt(document.getElementById(my1).style.top);
   let bottom1 = top1 + parseInt(document.getElementById(my1).style.height);
   let left2 = parseInt(document.getElementById(my2).style.left);
   let right2 = left2 + parseInt(document.getElementById(my2).style.width);
   let top2 = parseInt(document.getElementById(my2).style.top);
   let bottom2 = top2 + parseInt(document.getElementById(my2).style.height);
   if (
      (right1 >= left2) &&
      (bottom1 >= top2) &&
      (left1 <= right2) &&
      (top1 <= bottom2)
   ) {
return true;}
   return false;}
function myCheckHit() {
   if (myHitOther('myImg01', 'myImg02')) {
      alert('You lose!');
      document.getElementById('myImg01').style.left = '20px';
      location.href = 't2a18-game-template-blaze.html';}}
</script>
<img id="myImg01"
style="position:absolute; width:100px; height:80px; top:0px; left:50px;"
src="https://cdn.wallpapersafari.com/28/74/G5nb1L.png">
<img id="myImg02"
style="position:absolute; width:100px; height:80px; top:0px; left:250px;"
src="https://i.pinimg.com/originals/2e/72/d4/2e72d42c1e42bd1fbb77d72b82f57216.png"><br><br>
<input type="button"
value="Auto Background Left"
onclick="
   clearInterval(myClock);
   myClock = setInterval(function() {
      myGlobalX -= 5;
      document.getElementById('myBody').style.backgroundPosition =
      myGlobalX + 'px 0px';
   }, 100);">
<input type="button"
value="Image Right Fast Button"
onclick="
   document.getElementById('myImg01').style.left =
   parseInt(document.getElementById('myImg01').style.left) + 10 + 'px';
   myCheckHit();">
</body>
</html>
