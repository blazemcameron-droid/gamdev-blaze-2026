h1 align=center>t2a19-JSON</h1><script>
async function fetchData(url){
const response = await fetch(url);
const data = await response.json();
console.log(data)
const myJson = JSON.stringify(data, null, 2);
document.getElementById('myDiv01').innerHTML = '<pre>${myJson}</pre>';
document.getElementById('myDiv01').innerHTML += '<img src="${data.image}" alt="Random Image" style="max-width: 100%; height: auto;">';} </script>
JSON is short for JavaScript Object Notation. It uses human-readable text to data objects consisting of name–value pairs, arrays, and other serializable values.<br>
You can find the Wikipedia article <a href="https://en.wikipedia.org/wiki/JSON">here</a>.
<select id="mySelect" size="1" onchange="fetchData(this.value)">
