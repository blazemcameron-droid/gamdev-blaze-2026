<!DOCTYPE html>
<html>
<head>
<title>t2a21-Spy</title>
<style>
body {
  font-family: Arial;
  background: #151515;
  color: lime;
  text-align: center;
  padding: 20px;
}
textarea {
  width: 85%;
  height: 100px;
  background: black;
  color: lime;
  border: 2px solid lime;
  padding: 10px;
}
input, select, button {
  padding: 10px;
  margin: 8px;
}
button {
  background: lime;
  border: none;
  cursor: pointer;
  font-weight: bold;
}
button:hover {
  background: white;
}
#stickyNote {
  position: fixed;
  top: 15px;
  right: 15px;
  background: #fff176;
  color: black;
  width: 120px;
  padding: 15px;
  transform: rotate(4deg);
  box-shadow: 3px 5px 10px #000;
  font-family: "Comic Sans MS", cursive;
  z-index: 100;
}
#status {
  color: lime;
  font-weight: bold;
}
#explanation {
  display: none;
  width: 85%;
  margin: 20px auto;
  padding: 15px;
  border: 2px solid lime;
  background: #222;
  color: white;
  text-align: left;
  line-height: 1.6;
}
#explanation h3 {
  color: lime;
}
</style>
</head>
<body>
<div id="stickyNote">
  <h2>1111</h2>
</div>
<h1>t2a21-Spy</h1>
<h3>Advanced Encryption and Decryption</h3>
<p>Enter your secret message:</p>
<textarea id="myArea01">Hello how are you?</textarea>
<p>Enter Password:</p>
<input type="password" id="myPassword"
placeholder="Enter password">
<p>Choose encryption method:</p>
<select id="myMethod">
  <option value="AES">AES-256-GCM</option>
  <option value="CAESAR">Caesar Cipher</option>
</select><br>
<button onclick="encryptMessage()">Encrypt</button>
<button onclick="decryptMessage()">Decrypt</button>
<button onclick="hashMessage()">SHA-256 Hash</button>
<p>Encrypted / Decrypted Result:</p>
<textarea id="myArea02"></textarea>
<p id="status">SYSTEM READY</p>
<button onclick="explainEncryption()">
Explain Encryption Method
</button>
<div id="explanation">
  <h3 id="explanationTitle"></h3>
  <p id="explanationText"></p>
</div>
<script>
function checkPassword() {
  let password =
    document.getElementById("myPassword").value;
  if (password !== "1111") {
    document.getElementById("status").innerText =
      "ACCESS DENIED!";
    alert("ACCESS DENIED! Incorrect password. IT'S LITERALLY ON  STICKY NOTE!");
    return false;
  }
  document.getElementById("status").innerText =
    "ACCESS GRANTED";
  return true;
}
function toBase64(bytes) {
  let binary = "";
  bytes.forEach(b =>
    binary += String.fromCharCode(b)
  );
  return btoa(binary);
}
function fromBase64(str) {
  return Uint8Array.from(
    atob(str),
    c => c.charCodeAt(0)
  );
}
async function makeKey(password, salt) {
  const encoder = new TextEncoder();
  const material = await crypto.subtle.importKey(
    "raw",
    encoder.encode(password),
    "PBKDF2",
    false,
    ["deriveKey"]
  );
  return crypto.subtle.deriveKey(
    {
      name: "PBKDF2",
      salt: salt,
      iterations: 600000,
      hash: "SHA-256"
    },
    material,
    {
      name: "AES-GCM",
      length: 256
    },
    false,
    ["encrypt", "decrypt"]
  );
}
function explainEncryption() {
  const method =
    document.getElementById("myMethod").value;
  const explanation =
    document.getElementById("explanation");
  const title =
    document.getElementById("explanationTitle");
  const text =
    document.getElementById("explanationText");
  explanation.style.display = "block";
  if (method === "AES") {
    title.innerText = "AES-256-GCM Encryption";
    text.innerHTML = `
      <b>What is AES?</b><br>
      AES stands for Advanced Encryption Standard.
      It is a modern symmetric encryption algorithm.
      <br><br><b>How does it work?</b><br>
      1. Your password is converted into a secure
      encryption key using PBKDF2 and SHA-256.<br>
      2. AES uses a 256-bit key to encrypt your message.<br>
      3. A random 16-byte salt helps generate a unique key.<br>
      4. A random 12-byte IV (initialization vector)
      ensures that encrypting the same message again
      produces different encrypted data.<br>
      5. GCM (Galois/Counter Mode) also checks that
      the encrypted message has not been modified.
      <br><br><b>Why is it useful?</b><br>
      AES-256-GCM is widely used to protect sensitive
      information, passwords, files and communications.
      <br><br><b>Important:</b><br>
      The correct password is required to decrypt
      the message.
    `;
  } else {
    title.innerText = "Caesar Cipher Encryption";
    text.innerHTML = `
      <b>What is a Caesar Cipher?</b><br>
      The Caesar Cipher is one of the oldest and
      simplest encryption techniques.
      <br><br><b>How does it work?</b><br>
      1. Each letter in the message is shifted
      forwards or backwards in the alphabet. (in this case, three foward)<br>
      2. For example, A becomes D, B becomes E
      and C becomes F.<br>
      3. Letters near the end of the alphabet
      wrap around to the beginning.<br>
      4. To decrypt the message, each letter is
      shifted three positions backwards.
      <br><br><b>Example:</b><br>
      Original: HELLO<br>
      Encrypted: KHOOR
      <br><br><b>Why is it useful?</b><br>
      It is useful for learning the basic ideas
      behind encryption and substitution ciphers.
      <br><br><b>Security warning:</b><br>
      Caesar Cipher is not secure for real secrets
      because there are only 25 possible shifts.
    `;
  }
}
async function encryptMessage() {
  if (!checkPassword()) return;
  const message =
    document.getElementById("myArea01").value;
  const password =
    document.getElementById("myPassword").value;
  const method =
    document.getElementById("myMethod").value;
  if (!message) {
    alert("Enter a message!");
    return;
  }
  if (method === "CAESAR") {
    let result = message.replace(/[a-z]/gi, char => {
      let base =
        char === char.toUpperCase() ? 65 : 97;
      return String.fromCharCode(
        (char.charCodeAt(0) - base + 3) % 26 + base
      );
    });
    document.getElementById("myArea02").value =
      "CAESAR:" + result;
    document.getElementById("status").innerText =
      "CAESAR ENCRYPTION COMPLETE";
    return;
  }
  try {
    const salt = crypto.getRandomValues(
      new Uint8Array(16)
    );
    const iv = crypto.getRandomValues(
      new Uint8Array(12)
    );
    const key = await makeKey(password, salt);
    const encrypted = await crypto.subtle.encrypt(
      { name: "AES-GCM", iv: iv },
      key,
      new TextEncoder().encode(message)
    );
    const combined = new Uint8Array(
      16 + 12 + encrypted.byteLength
    );
    combined.set(salt, 0);
    combined.set(iv, 16);
    combined.set(new Uint8Array(encrypted), 28);
    document.getElementById("myArea02").value =
      "AES256:" + toBase64(combined);
    document.getElementById("status").innerText =
      "AES-256 ENCRYPTION COMPLETE";
  } catch (error) {
    alert("Encryption failed. Use HTTPS or localhost.");
  }
}
async function decryptMessage() {
  if (!checkPassword()) return;
  const encryptedText =
    document.getElementById("myArea02").value.trim();
  const password =
    document.getElementById("myPassword").value;
  if (!encryptedText) {
    alert("Enter encrypted text in the result box!");
    return;
  }
  try {
    if (encryptedText.startsWith("CAESAR:")) {
      const text = encryptedText.substring(7);
      const result = text.replace(/[a-z]/gi, char => {
        let base =
          char === char.toUpperCase() ? 65 : 97;
        return String.fromCharCode(
          (char.charCodeAt(0) - base + 23) % 26 + base
        );
      });
      document.getElementById("myArea01").value =
        result;
      document.getElementById("status").innerText =
        "CAESAR DECRYPTION COMPLETE";
      return;
    }
    if (encryptedText.startsWith("AES256:")) {
      const data = fromBase64(
        encryptedText.substring(7)
      );
      if (data.length < 45) {
        throw new Error("Invalid encrypted data");
      }
      const salt = data.slice(0, 16);
      const iv = data.slice(16, 28);
      const encrypted = data.slice(28);
      const key = await makeKey(password, salt);
      const decrypted = await crypto.subtle.decrypt(
        { name: "AES-GCM", iv: iv },
        key,
        encrypted
      );
      document.getElementById("myArea01").value =
        new TextDecoder().decode(decrypted);
      document.getElementById("status").innerText =
        "AES DECRYPTION SUCCESSFUL";
      return;
    }
    throw new Error("Unknown encryption format");
  } catch (error) {
    document.getElementById("status").innerText =
      "DECRYPTION FAILED";
    alert("DECRYPTION FAILED! Check your encrypted text.");
  }
}
async function hashMessage() {
  if (!checkPassword()) return;
  try {
    const message =
      document.getElementById("myArea01").value;
    const hash = await crypto.subtle.digest(
      "SHA-256",
      new TextEncoder().encode(message)
    );
    document.getElementById("myArea02").value =
      Array.from(new Uint8Array(hash))
        .map(b => b.toString(16).padStart(2, "0"))
        .join("");
    document.getElementById("status").innerText =
      "SHA-256 HASH COMPLETE";
    document.getElementById("explanationTitle").innerText =
      "SHA-256 Hashing";
    document.getElementById("explanationText").innerHTML = `
      <b>What is SHA-256?</b><br>
      SHA-256 stands for Secure Hash Algorithm 256-bit.
      It is a cryptographic hashing algorithm.
      <br><br><b>How does it work?</b><br>
      1. Your original message is entered into
      the SHA-256 algorithm.<br>
      2. The algorithm processes the message.<br>
      3. It produces a fixed-length output of
      256 bits (64 hexadecimal characters).<br>
      4. Even a tiny change to the original message
      produces a very different hash.
      <br><br><b>Important features:</b><br>
      - Hashing is one-way: the original message
      cannot practically be recovered from its hash.<br>
      - The same input always produces the same hash.<br>
      - It is useful for checking data integrity.
      <br><br><b>Encryption vs Hashing:</b><br>
      Encryption can be reversed using the correct key.
      Hashing is designed to be irreversible.
    `;
    document.getElementById("explanation").style.display =
      "block";
  } catch (error) {
    alert("Hashing failed!");
  }
}
</script>
</body>
</html>
