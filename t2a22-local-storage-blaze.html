<h1 align=center>t2a22-Local Data Storage</h1>
Use local storage to cache character data
<body onload="{
myStorage = localStorage.getItem('myStoredData')
if(myStorage  != null){
document.getElementById('myText1').value = myStorage }}">
<body onunload="{
localstorage.setItem('myStoredData',document.getElementById('myText1').value) }">   
Text example: <input id="myText1" type=text size=70 value="" placeholder="Write data here to store"><br>
<input type="button" value="Store Data" onClick="{
localStorage.setItem('myStoredData', document.getElementById('myText1').value)
alert(document.getElementById('myText1').value + ' \nHas been stored')
document.getElementById('myText1').value = '' }">
<input type="button" value="Retrieve Data" onClick="{
document.getElementById('myText1').value = localStorage.getItem('myStoredData') }">
